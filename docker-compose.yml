services:

  # =========================================================
  # AUTH DATABASE
  # =========================================================
  auth-postgres:
    image: postgres:17
    container_name: ecommerce-auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    ports:
      - "${AUTH_DB_PORT}:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # CUSTOMER DATABASE
  # =========================================================
  customer-postgres:
    image: postgres:17
    container_name: ecommerce-customer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}

    ports:
      - "${CUSTOMER_DB_PORT}:5432"

    volumes:
      - customer_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CUSTOMER_DB_USER} -d ${CUSTOMER_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # ORDER DATABASE
  # =========================================================
  order-postgres:
    image: postgres:17
    container_name: ecommerce-order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}

    ports:
      - "${ORDER_DB_PORT}:5432"

    volumes:
      - order_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:8.0
    container_name: ecommerce-mongodb
    restart: unless-stopped

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # KAFKA - KRaft
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ecommerce-kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:29093,
        PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # =========================================================
  # AUTH SERVICE
  # =========================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile

    container_name: ecommerce-auth-service
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-postgres:5432/${AUTH_DB_NAME}?schema=public"

      JWT_SECRET: "ecommerce_mvp_secret_key_2026"
      JWT_EXPIRES_IN: "1h"

      GRPC_PORT: "50051"
      HTTP_PORT: "4001"

    ports:
      - "4001:4001"
      - "50051:50051"

    depends_on:
      auth-postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        npx prisma migrate deploy --config prisma7.config.ts
        && npm start

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================================
  # CUSTOMER SERVICE
  # =========================================================
  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile

    container_name: ecommerce-customer-service
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://${CUSTOMER_DB_USER}:${CUSTOMER_DB_PASSWORD}@customer-postgres:5432/${CUSTOMER_DB_NAME}?schema=public"

      GRPC_PORT: "50052"
      HTTP_PORT: "4002"

    ports:
      - "4002:4002"
      - "50052:50052"

    depends_on:
      customer-postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        npx prisma migrate deploy --config prisma7.config.ts
        && npm start

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================================
  # PRODUCT SERVICE
  # =========================================================
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile

    container_name: ecommerce-product-service
    restart: unless-stopped

    environment:
      MONGO_URI: "mongodb://mongodb:27017/product_db"

      GRPC_PORT: "50053"
      HTTP_PORT: "4003"

    ports:
      - "4003:4003"
      - "50053:50053"

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================================
  # ORDER SERVICE
  # =========================================================
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile

    container_name: ecommerce-order-service
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@order-postgres:5432/${ORDER_DB_NAME}?schema=public"

      GRPC_PORT: "50054"
      HTTP_PORT: "4004"

      CUSTOMER_GRPC_URL: "customer-service:50052"
      PRODUCT_GRPC_URL: "product-service:50053"

      KAFKA_BROKER: "kafka:29092"
      KAFKA_CLIENT_ID: "order-service"
      ORDER_CREATED_TOPIC: "order.created"

      KAFKAJS_NO_PARTITIONER_WARNING: "1"

    ports:
      - "4004:4004"
      - "50054:50054"

    depends_on:
      order-postgres:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      kafka:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        npx prisma migrate deploy --config prisma7.config.ts
        && npm start

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  # =========================================================
  # SHIPMENT SERVICE
  # =========================================================
  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile

    container_name: ecommerce-shipment-service
    restart: unless-stopped

    environment:
      MONGO_URI: "mongodb://mongodb:27017/shipment_db"

      GRPC_PORT: "50055"
      HTTP_PORT: "4005"

      KAFKA_BROKER: "kafka:29092"
      KAFKA_GROUP_ID: "shipment-service-group"
      ORDER_CREATED_TOPIC: "order.created"

    ports:
      - "4005:4005"
      - "50055:50055"

    depends_on:
      mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  # =========================================================
  # API GATEWAY
  # =========================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: ecommerce-api-gateway
    restart: unless-stopped

    environment:
      PORT: "3000"

      AUTH_GRPC_URL: "auth-service:50051"
      AUTH_HTTP_URL: "http://auth-service:4001"

      CUSTOMER_GRPC_URL: "customer-service:50052"
      CUSTOMER_HTTP_URL: "http://customer-service:4002"

      PRODUCT_GRPC_URL: "product-service:50053"
      PRODUCT_HTTP_URL: "http://product-service:4003"

      ORDER_GRPC_URL: "order-service:50054"
      ORDER_HTTP_URL: "http://order-service:4004"

      SHIPMENT_GRPC_URL: "shipment-service:50055"
      SHIPMENT_HTTP_URL: "http://shipment-service:4005"

      REDIS_URL: "redis://redis:6379"

      JWT_SECRET: "ecommerce_mvp_secret_key_2026"

      RATE_LIMIT_WINDOW: "60"
      RATE_LIMIT_MAX: "5"

    ports:
      - "3000:3000"

    depends_on:
      redis:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

      shipment-service:
        condition: service_healthy


# =========================================================
# VOLUMES
# =========================================================
volumes:

  auth_postgres_data:

  customer_postgres_data:

  order_postgres_data:

  mongodb_data:

  redis_data:

  kafka_data: