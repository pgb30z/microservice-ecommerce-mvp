syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc GetUserById (GetUserRequest) returns (UserResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string fullname = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message GetUserRequest {
  int32 uid = 1;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  int32 uid = 4;
  string role = 5;
}

message UserResponse {
  int32 uid = 1;
  string username = 2;
  int32 roleid = 3;
  string rolename = 4;
}